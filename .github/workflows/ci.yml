name: CI — Test Suite

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Run engine + UI test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start threaded local server
        run: |
          python3 - <<'PY' &
          import http.server, socketserver
          class Handler(socketserver.ThreadingMixIn, http.server.SimpleHTTPRequestHandler):
              pass
          socketserver.TCPServer(('0.0.0.0', 8000), Handler).serve_forever()
          PY
          for i in 1 2 3 4 5; do curl -sf http://localhost:8000/ && break; sleep 1; done
        working-directory: ${{ github.workspace }}

      - name: Run full test suite (engine + UI)
        run: npm test
        env:
          CI: true
