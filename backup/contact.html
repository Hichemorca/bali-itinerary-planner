<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us — BaliPlan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-[#F5F5F5] text-[#212121]">
  <nav class="bg-white border-b border-gray-100">
    <div class="max-w-4xl mx-auto px-5 py-3 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2">
        <i class="fa-solid fa-leaf text-[#2E7D32] text-xl"></i>
        <span class="font-heading font-bold text-lg text-[#1B5E20]">BaliPlan</span>
      </a>
    </div>
  </nav>
  <main class="max-w-xl mx-auto px-5 py-14">
    <div class="bg-white rounded-3xl border border-gray-100 p-9 text-center">
      <div class="w-16 h-16 rounded-full bg-[#2E7D32]/10 flex items-center justify-center mx-auto mb-5">
        <i class="fa-solid fa-envelope text-[#2E7D32] text-2xl"></i>
      </div>
      <h1 class="font-heading font-extrabold text-2xl mb-3">Contact Us</h1>
      <p class="text-[#757575] text-sm mb-7">Have a question about your itinerary, a booking link, or a refund?</p>
      <p class="mb-6">
        <a href="mailto:support@baliplan.travel" class="btn-primary px-8 py-3">
          <i class="fa-solid fa-paper-plane mr-2"></i>support@baliplan.travel
        </a>
      </p>
      <p class="text-xs text-[#757575]">We typically respond within 24 hours (Monday–Friday).</p>
    </div>
  </main>
</body>
</html>
