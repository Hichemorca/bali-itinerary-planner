<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bali Quiz — Build Your Custom Itinerary</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-[#F5F5F5] text-[#212121] min-h-screen">

  <nav class="bg-white border-b border-gray-100">
    <div class="max-w-4xl mx-auto px-5 py-3 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2">
        <i class="fa-solid fa-leaf text-[#2E7D32] text-xl"></i>
        <span class="font-heading font-bold text-lg text-[#1B5E20]">BaliPlan</span>
      </a>
      <a href="index.html" class="text-sm text-[#757575] hover:text-[#2E7D32]"><i class="fa-solid fa-house mr-1"></i>Home</a>
    </div>
  </nav>

  <main class="max-w-3xl mx-auto px-5 py-12">
    <!-- Progress bar -->
    <div class="mb-8">
      <div class="flex justify-between text-sm font-medium text-[#757575] mb-2">
        <span id="progress-label">Question 1 of 4</span>
        <span id="progress-pct">20%</span>
      </div>
      <div class="h-2.5 bg-gray-200 rounded-full overflow-hidden">
        <div id="progress-bar" class="h-full bg-gradient-to-r from-[#2E7D32] to-[#F9A825] rounded-full transition-all duration-500" style="width:25%"></div>
      </div>
    </div>

    <!-- Question container -->
    <div id="question-container" class="bg-white rounded-3xl shadow-sm border border-gray-100 p-8 md:p-10 min-h-[380px]"></div>

    <!-- Nav buttons -->
    <div class="flex justify-between mt-8">
      <button id="btn-prev" class="px-6 py-3 rounded-xl border border-gray-300 text-[#757575] font-semibold hover:bg-gray-100 transition disabled:opacity-40 disabled:cursor-not-allowed" disabled>
        <i class="fa-solid fa-arrow-left mr-2"></i>Back
      </button>
      <button id="btn-next" class="btn-primary px-8 py-3 hidden">Next <i class="fa-solid fa-arrow-right ml-2"></i></button>
      <button id="btn-submit" class="btn-gold px-8 py-3 hidden font-bold">
        <i class="fa-solid fa-wand-magic-sparkles mr-2"></i>Show My Itinerary
      </button>
    </div>

    <!-- Loading state (hidden) -->
    <div id="loading-overlay" class="hidden fixed inset-0 bg-[#1B2B25]/85 z-50 flex items-center justify-center">
      <div class="text-center text-white">
        <i class="fa-solid fa-spinner fa-spin text-4xl text-[#F9A825] mb-5"></i>
        <p class="font-heading font-bold text-2xl mb-2">Building your Bali plan…</p>
        <p id="loading-step" class="text-white/70 text-sm">Filtering 90 activities by your budget…</p>
      </div>
    </div>
  </main>

  <script src="js/analytics.js"></script>
  <script src="js/quiz.js?v=ph6"></script>
<script src="js/dark-mode.js"></script>
</body>
</html>
