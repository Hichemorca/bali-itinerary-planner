<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You — Your Bali Plan is Ready</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tailwind.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-[#F5F5F5] text-[#212121]">
  <main class="min-h-screen flex items-center justify-center px-5 py-12">
    <div class="max-w-xl w-full bg-white rounded-3xl border border-gray-100 p-10 text-center">
      <div class="w-20 h-20 rounded-full bg-[#2E7D32]/10 flex items-center justify-center mx-auto mb-6">
        <i class="fa-solid fa-circle-check text-[#2E7D32] text-4xl"></i>
      </div>
      <h1 class="font-heading font-extrabold text-3xl mb-3">Thank You!</h1>
      <p class="text-[#757575] mb-8">
        Your payment is confirmed. You can now access your full personalized Bali itinerary,
        download the printable PDF, and book every activity with one click.
      </p>
      <a href="result.html" class="btn-primary text-lg px-8 py-4 w-full justify-center">
        <i class="fa-solid fa-map mr-2"></i>Open My Itinerary
      </a>
      <p class="text-xs text-[#757575] mt-6">
        Didn't receive the download link? Check the email you used at checkout, or
        <a href="mailto:support@baliplan.travel" class="text-[#2E7D32] font-semibold underline">contact support</a>.
      </p>
    </div>
  </main>
<script src="js/analytics.js"></script>
<script src="js/dark-mode.js"></script>
</body>
</html>
